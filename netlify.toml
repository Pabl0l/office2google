# Configuración de despliegue en Netlify (plan gratuito, dominio *.netlify.app)
# En Netlify: Site configuration → Build & deploy → Base directory = "site"
# (este archivo se lee desde la raíz del repo)

[build]
	publish = "site"

# URLs limpias para los documentos legales (las que pide Google)
[[redirects]]
	from = "/privacidad"
	to = "/privacy.html"
	status = 200

[[redirects]]
	from = "/politica-de-privacidad"
	to = "/privacy.html"
	status = 200

[[redirects]]
	from = "/terminos"
	to = "/terms.html"
	status = 200

[[redirects]]
	from = "/condiciones"
	to = "/terms.html"
	status = 200

[[redirects]]
	from = "/privacy"
	to = "/privacy.html"
	status = 200

[[redirects]]
	from = "/terms"
	to = "/terms.html"
	status = 200

[[redirects]]
	from = "/*"
	to = "/404.html"
	status = 404

[[headers]]
	for = "/*"
	[headers.values]
		X-Content-Type-Options = "nosniff"
		X-Frame-Options = "DENY"
		Referrer-Policy = "strict-origin-when-cross-origin"
		Permissions-Policy = "camera=(), microphone=(), geolocation=()"
